name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: factoryflow
          POSTGRES_USER: factoryflow
          POSTGRES_PASSWORD: factoryflow_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U factoryflow -d factoryflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      CI: true
      DATABASE_URL: postgresql://factoryflow:factoryflow_ci_password@127.0.0.1:5432/factoryflow?schema=public
      AUTH_SECRET: factoryflow-ci-only-auth-secret-not-for-production-123456789

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Check database
        run: npm run db:check

      - name: Run tests
        run: npm test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Build
        run: npm run build
